<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Coins - Crypto Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <div class="container py-4">
      <h1>Coins</h1>
      <div class="row gy-4">
        <div class="col-lg-8">
          <div class="card p-3">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h4 class="m-0">Market Chart</h4>
              <div>
                <select id="marketSelect" class="form-select form-select-sm">
                  <option value="bitcoin" selected>Bitcoin (BTC)</option>
                  <option value="ethereum">Ethereum (ETH)</option>
                  <option value="tether">Tether (USDT)</option>
                  <option value="binancecoin">BNB (BNB)</option>
                  <option value="usd-coin">USD Coin (USDC)</option>
                  <option value="cardano">Cardano (ADA)</option>
                  <option value="solana">Solana (SOL)</option>
                  <option value="polkadot">Polkadot (DOT)</option>
                </select>
              </div>
            </div>
            <div class="canvas-container">
              <canvas id="marketChart"></canvas>
            </div>
          </div>
          <div id="coins-table" class="table-responsive mt-4"></div>
        </div>
        <div class="col-lg-4">
          <div class="card p-3">
            <h5>Currency Info</h5>
            <div id="currencyInfo" class="mt-3">
              <p class="mb-1"><strong>Price:</strong> <span id="ci-price">—</span></p>
              <p class="mb-1"><strong>Market Cap:</strong> <span id="ci-marketcap">—</span></p>
              <p class="mb-1"><strong>24h Change:</strong> <span id="ci-change">—</span></p>
            </div>
            <hr />
            <h6>Currency Converter</h6>
            <div class="converter mt-2">
              <div class="mb-2">
                <label class="form-label">Amount</label>
                <input id="conv-amount" type="number" class="form-control" value="1" min="0" step="any">
              </div>
              <div class="mb-2 d-flex gap-2">
                <select id="conv-from" class="form-select">
                  <option value="bitcoin">Bitcoin (BTC)</option>
                  <option value="ethereum">Ethereum (ETH)</option>
                  <option value="tether">Tether (USDT)</option>
                  <option value="usd-coin">USD Coin (USDC)</option>
                </select>
                <select id="conv-to" class="form-select">
                  <option value="usd">USD</option>
                  <option value="eur">EUR</option>
                  <option value="inr">INR</option>
                  <option value="gbp">GBP</option>
                  <option value="jpy">JPY</option>
                </select>
              </div>
              <div class="d-flex gap-2">
                <button id="conv-calc" class="btn btn-primary">Calculate</button>
                <button id="conv-swap" class="btn btn-outline-secondary">Swap</button>
              </div>
              <p class="mt-3"><strong>Result:</strong> <span id="conv-result">—</span></p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/market.js"></script>
    <script src="js/converter.js"></script>
    <script src="js/coins.js"></script>
  </body>
</html>
